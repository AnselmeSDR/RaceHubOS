name: Optional sector-timing validation
on:
  push:
    branches: [feat/sector-timing]
  pull_request:
    paths:
      - '.github/workflows/sector-timing.yml'
      - 'packages/backend/src/lib/sectorTiming.js'
      - 'packages/backend/src/routes/sectorTiming.js'
      - 'packages/backend/src/services/SyncService.js'
      - 'packages/backend/src/services/SessionService.js'
      - 'packages/backend/src/__tests__/sector*.test.js'
      - 'packages/frontend/src/components/race/Sector*.jsx'
      - 'packages/frontend/src/components/race/useSectorTiming.js'
      - 'packages/frontend/tests/sector-timing/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sector-timing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: git fetch --no-tags https://github.com/AnselmeSDR/RaceHubOS.git +main:refs/remotes/origin/main
      - run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev
      - run: npm ci
      - run: npm run prisma:generate -w @racehubos/backend
      - run: npm run check:push
      - run: npm test -w @racehubos/backend
      - run: npx playwright install --with-deps chromium
      - run: node node_modules/@playwright/test/cli.js test --config packages/frontend/tests/sector-timing/config.js
      - run: npm run build
