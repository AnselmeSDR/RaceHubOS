# Publishes site/ on GitHub Pages: https://anselmesdr.github.io/RaceHubOS/
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'RaceHubOS-install-*'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'addons/catalog.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test
        run: node --test 'site/tests/*.test.mjs'
      - name: Build
        run: node site/scripts/build.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
